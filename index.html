<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Bolão Copa 2026 🏆</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0f1e;color:#fff;font-family:'Inter',sans-serif;min-height:100vh}
input{outline:none;font-family:'Inter',sans-serif}
input:focus{border-color:#FFD700!important}
button{cursor:pointer;font-family:'Inter',sans-serif;transition:opacity .15s}
button:active{opacity:.7}
.screen{max-width:480px;margin:0 auto;padding:20px 16px 80px}
.card{background:#131929;border-radius:16px;padding:18px 16px;margin-bottom:14px;border:1px solid #1a2540}
.label{font-size:11px;font-weight:700;letter-spacing:2px;color:#FFD700;margin-bottom:10px}
.inp{background:#0d1525;border:1px solid #1a2540;border-radius:10px;padding:11px 14px;color:#fff;font-size:15px;width:100%}
.btn{border:none;border-radius:10px;padding:11px 0;font-size:14px;font-weight:600}
.btn-green{background:#00e676;color:#000;width:46px;font-size:22px}
.btn-outline{background:transparent;border:1px solid #1a2540;color:#888;flex:1}
.btn-gold{background:#FFD700;color:#000;width:100%;font-size:16px;font-weight:800;padding:14px 0;border-radius:10px;border:none;margin-top:20px}
.player-btn{display:flex;align-items:center;gap:10px;background:#0d1525;border:1px solid #1a2540;border-radius:10px;padding:10px 14px;color:#fff;width:100%;text-align:left;margin-bottom:8px}
.avatar{width:34px;height:34px;background:#FFD700;color:#000;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;flex-shrink:0}
.header{display:flex;align-items:center;gap:14px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #1a2540}
.back-btn{background:none;border:1px solid #1a2540;border-radius:8px;color:#777;padding:6px 12px;font-size:16px}
.match-card{background:#131929;border-radius:14px;padding:12px;border:1px solid #1a2540;margin-bottom:10px}
.score-inp{width:38px;height:38px;background:#0d1525;border:1px solid #1a2540;border-radius:8px;color:#FFD700;font-size:17px;font-weight:700;text-align:center}
.group-btn{background:#131929;color:#666;border:1px solid #1a2540;border-radius:20px;padding:5px 14px;font-size:12px;font-weight:700;white-space:nowrap;flex-shrink:0}
.group-btn.active{background:#FFD700;color:#000}
.groups-scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;margin-bottom:4px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px 24px;border-radius:30px;font-weight:700;z-index:9999;font-size:14px;box-shadow:0 4px 20px rgba(0,0,0,.5);white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;color:#555;font-size:14px;padding:40px 0}
#app>div{display:none}
#app>div.active{display:block}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:#1e2d4a;border-radius:4px}
.spinner{width:20px;height:20px;border:2px solid #1a2540;border-top-color:#FFD700;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.live-dot{width:7px;height:7px;background:#00e676;border-radius:50%;display:inline-block;margin-right:5px;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.score-inp:disabled{opacity:.35;cursor:not-allowed}
.locked-badge{font-size:10px;color:#555;font-weight:700;letter-spacing:1px}
</style>
</head>
<body>
<div id="app">
  <div id="screen-home" class="active"></div>
  <div id="screen-game"></div>
  <div id="screen-ranking"></div>
  <div id="screen-admin"></div>
</div>
<div class="toast" id="toast"></div>

<!-- Firebase SDK (compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>

// ── Dados dos jogos ───────────────────────────────────────────────────────

  "México":"mx","África do Sul":"za","Coreia do Sul":"kr","Rep. Tcheca":"cz",
  "Canadá":"ca","Itália":"it","Estados Unidos":"us","Paraguai":"py",

  "Costa do Marfim":"ci","Equador":"ec","Tunísia":"tn","Ucrânia":"ua",

  "Arábia Saudita":"sa","Uruguai":"uy","Irã":"ir","Nova Zelândia":"nz",
  "Argentina":"ar","Argélia":"dz","França":"fr","Senegal":"sn",
  "Noruega":"no","Iraque":"iq","Áustria":"at","Jordânia":"jo",
  "Portugal":"pt","RD Congo":"cd","Inglaterra":"gb-eng","Croácia":"hr",
  "Gana":"gh","Panamá":"pa","Uzbequistão":"uz","Colômbia":"co"

const fl = n => ISO[n]
  ? `<img src="https://flagcdn.com/w40/${ISO[n]}.png" style="height:22px;width:auto;border-radius:2px;vertical-align:middle" alt="${n}">`
  : "🏳️";

const BASE_MATCHES = [
  [1,"México","África do Sul","11/06","16:00","A",1],[2,"Coreia do Sul","Rep. Tcheca","11/06","23:00","A",1],
  [3,"Canadá","Itália","12/06","16:00","B",1],[4,"Estados Unidos","Paraguai","12/06","22:00","G",1],
  [5,"Austrália","Turquia","13/06","01:00","H",1],[6,"Catar","Suíça","13/06","16:00","B",1],
  [7,"Brasil","Marrocos","13/06","19:00","C",1],[8,"Haiti","Escócia","13/06","22:00","C",1],
  [9,"Alemanha","Curaçao","14/06","14:00","E",1],[10,"Holanda","Japão","14/06","17:00","F",1],
  [11,"Costa do Marfim","Equador","14/06","20:00","E",1],[12,"Ucrânia","Tunísia","14/06","23:00","F",1],
  [13,"Espanha","Cabo Verde","15/06","13:00","K",1],[14,"Bélgica","Egito","15/06","16:00","I",1],
  [15,"Arábia Saudita","Uruguai","15/06","19:00","K",1],[16,"Irã","Nova Zelândia","15/06","22:00","I",1],
  [17,"Argentina","Argélia","16/06","14:00","D",1],[18,"França","Senegal","16/06","16:00","J",1],
  [19,"Iraque","Noruega","16/06","19:00","J",1],[20,"Áustria","Jordânia","17/06","01:00","D",1],
  [21,"Portugal","RD Congo","17/06","14:00","L",1],[22,"Inglaterra","Croácia","17/06","17:00","G",1],
  [23,"Gana","Panamá","17/06","20:00","H",1],[24,"Uzbequistão","Colômbia","17/06","23:00","L",1],
  [25,"Rep. Tcheca","África do Sul","18/06","13:00","A",2],[26,"Suíça","Itália","18/06","16:00","B",2],
  [27,"Canadá","Catar","18/06","19:00","B",2],[28,"México","Coreia do Sul","18/06","22:00","A",2],
  [29,"Turquia","Paraguai","19/06","01:00","H",2],[30,"Estados Unidos","Austrália","19/06","16:00","G",2],
  [31,"Escócia","Marrocos","19/06","19:00","C",2],[32,"Brasil","Haiti","19/06","22:00","C",2],
  [33,"Holanda","Ucrânia","20/06","14:00","F",2],[34,"Alemanha","Costa do Marfim","20/06","17:00","E",2],
  [35,"Equador","Curaçao","20/06","21:00","E",2],[36,"Tunísia","Japão","21/06","01:00","F",2],
  [37,"Espanha","Arábia Saudita","21/06","13:00","K",2],[38,"Bélgica","Irã","21/06","16:00","I",2],
  [39,"Uruguai","Cabo Verde","21/06","19:00","K",2],[40,"Nova Zelândia","Egito","21/06","22:00","I",2],
  [41,"Argentina","Áustria","22/06","14:00","D",2],[42,"França","Iraque","22/06","18:00","J",2],
  [43,"Noruega","Senegal","22/06","21:00","J",2],[44,"Jordânia","Argélia","23/06","00:00","D",2],
  [45,"Inglaterra","Gana","23/06","14:00","G",2],[46,"Portugal","Uzbequistão","23/06","17:00","L",2],
  [47,"Panamá","Croácia","23/06","20:00","H",2],[48,"Colômbia","RD Congo","23/06","23:00","L",2],
  [49,"Suíça","Canadá","24/06","16:00","B",3],[50,"Itália","Catar","24/06","16:00","B",3],
  [51,"Escócia","Brasil","24/06","19:00","C",3],[52,"Marrocos","Haiti","24/06","19:00","C",3],
  [53,"Rep. Tcheca","México","24/06","22:00","A",3],[54,"África do Sul","Coreia do Sul","24/06","22:00","A",3],
  [55,"Equador","Alemanha","25/06","17:00","E",3],[56,"Curaçao","Costa do Marfim","25/06","17:00","E",3],
  [57,"Japão","Ucrânia","25/06","20:00","F",3],[58,"Tunísia","Holanda","25/06","20:00","F",3],
  [59,"Turquia","Estados Unidos","25/06","23:00","G",3],[60,"Paraguai","Austrália","25/06","23:00","H",3],
  [61,"Noruega","França","26/06","16:00","J",3],[62,"Senegal","Iraque","26/06","16:00","J",3],
  [63,"Cabo Verde","Arábia Saudita","26/06","21:00","K",3],[64,"Uruguai","Espanha","26/06","21:00","K",3],
  [65,"Egito","Irã","27/06","00:00","I",3],[66,"Nova Zelândia","Bélgica","27/06","00:00","I",3],
  [67,"Panamá","Inglaterra","27/06","18:00","G",3],[68,"Croácia","Gana","27/06","18:00","H",3],
  [69,"Colômbia","Portugal","27/06","20:30","L",3],[70,"RD Congo","Uzbequistão","27/06","20:30","L",3],
  [71,"Argélia","Áustria","27/06","23:00","D",3],[72,"Jordânia","Argentina","27/06","23:00","D",3],
].map(([id,home,away,date,time,group,rodada])=>({id,home,away,date,time,group,rodada,homeFlag:fl(home),awayFlag:fl(away),realHome:null,realAway:null}));

// ── Estado global ─────────────────────────────────────────────────────────
let players = [];
let matches = JSON.parse(JSON.stringify(BASE_MATCHES));
let guesses = {};
let currentPlayer = null;
let adminUnlocked = false;
let gameFilter = "Todos";
let adminFilter = "Todos";

// ── Toast ─────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, type="ok") {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.background = type==="ok" ? "#00e676" : "#e53935";
  t.style.color = type==="ok" ? "#000" : "#fff";
  t.style.opacity = "1";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.style.opacity="0", 2500);
}

// ── Nav ───────────────────────────────────────────────────────────────────
function goTo(screen) {
  document.querySelectorAll("#app>div").forEach(d=>d.classList.remove("active"));
  document.getElementById("screen-"+screen).classList.add("active");
  window.scrollTo(0,0);
  ({home:renderHome, game:renderGame, ranking:renderRanking, admin:renderAdmin})[screen]();
}
window.goTo = goTo;

// ── Pontuação ─────────────────────────────────────────────────────────────
function calcPts(g, m) {
  if(m.realHome===null||m.realAway===null) return 0;
  if(g.home===m.realHome&&g.away===m.realAway) return 10;
  const gw=g.home>g.away?"h":g.home<g.away?"a":"d";
  const rw=m.realHome>m.realAway?"h":m.realHome<m.realAway?"a":"d";
  if(gw===rw) return rw==="d"?7:5;
  return 0;
}
function isLocked(m) {
  const [day, month] = m.date.split('/').map(Number);
  const [hour, min] = m.time.split(':').map(Number);
  return Date.now() >= Date.UTC(2026, month - 1, day, hour + 3, min);
}
function playerTotalPts(pid) {
  return matches.reduce((a,m)=>{ const g=guesses[pid]?.[m.id]; return g?a+calcPts(g,m):a; },0);
}
function playerFilled(pid) { return matches.filter(m=>guesses[pid]?.[m.id]).length; }

// ── Firebase listeners ────────────────────────────────────────────────────
function initFirebase() {
  // Jogadores
  db.ref("players").on("value", snap => {
    players = snap.val() ? Object.values(snap.val()) : [];
    if(document.getElementById("screen-home").classList.contains("active")) renderHome();
    if(document.getElementById("screen-ranking").classList.contains("active")) renderRanking();
  });
  // Palpites
  db.ref("guesses").on("value", snap => {
    guesses = snap.val() || {};
    if(document.getElementById("screen-ranking").classList.contains("active")) renderRanking();
    if(document.getElementById("screen-home").classList.contains("active")) renderHome();
  });
  // Resultados
  db.ref("results").on("value", snap => {
    const results = snap.val() || {};
    matches = BASE_MATCHES.map(m => ({
      ...m,
      realHome: results[m.id]?.home ?? null,
      realAway: results[m.id]?.away ?? null,
    }));
    if(document.getElementById("screen-game").classList.contains("active")) renderGame();
    if(document.getElementById("screen-ranking").classList.contains("active")) renderRanking();
    if(document.getElementById("screen-home").classList.contains("active")) renderHome();
  });
}

// ── HOME ──────────────────────────────────────────────────────────────────
function renderHome() {
  const played = matches.filter(m=>m.realHome!==null).length;
  let playersHTML = "";
  if(players.length > 0) {
    playersHTML = `<div class="card"><div class="label"><span class="live-dot"></span>PARTICIPANTES AO VIVO</div>`;
    players.forEach(p => {
      const pts = playerTotalPts(p.id), filled = playerFilled(p.id);
      playersHTML += `<button class="player-btn" onclick="selectPlayer('${p.id}')">
        <span class="avatar">${p.name[0].toUpperCase()}</span>
        <span style="flex:1;text-align:left">
          <span style="font-weight:700">${p.name}</span>
          <span style="display:block;font-size:11px;color:#555;margin-top:1px">${filled}/72 palpites</span>
        </span>
        <span style="color:#FFD700;font-weight:900;font-size:18px">${pts}<span style="font-size:11px;font-weight:400;color:#666"> pts</span></span>
        <span style="color:#333;font-size:20px;margin-left:8px">›</span>
      </button>`;
    });
    playersHTML += `</div>`;
  }
  document.getElementById("screen-home").innerHTML = `
    <div class="screen">
      <div style="text-align:center;padding:36px 0 24px">
        <div style="font-size:64px;margin-bottom:8px">🏆</div>
        <div style="font-family:'Bebas Neue',cursive;font-size:52px;line-height:1;letter-spacing:2px">BOLÃO<br><span style="color:#FFD700">COPA 2026</span></div>
        <p style="color:#555;margin-top:10px;font-size:13px">${played}/72 jogos apurados</p>
      </div>
      <div class="card">
        <div class="label">ENTRAR NO BOLÃO</div>
        <div style="display:flex;gap:8px">
          <input class="inp" id="new-name" placeholder="Seu nome..." onkeydown="if(event.key==='Enter')addPlayer()"/>
          <button class="btn btn-green" onclick="addPlayer()">+</button>
        </div>
      </div>
      ${playersHTML}
      <div style="display:flex;gap:10px;margin-top:4px">
        <button class="btn btn-outline" onclick="goTo('ranking')">🏅 Ranking</button>
        <button class="btn btn-outline" onclick="goTo('admin')">⚙️ Admin</button>
      </div>
    </div>`;
}

window.addPlayer = async function() {
  const inp = document.getElementById("new-name");
  const name = inp.value.trim();
  if(!name) return;
  if(players.find(p=>p.name.toLowerCase()===name.toLowerCase())) { showToast("Nome já existe!","err"); return; }
  const id = "p_"+Date.now();
  await db.ref(`players/${id}`).set({id, name});
  inp.value = "";
  showToast(`${name} entrou no bolão! 🎉`);
};

window.selectPlayer = function(id) {
  currentPlayer = players.find(p=>p.id===id);
  gameFilter = "Todos";
  goTo("game");
};

// ── GAME ──────────────────────────────────────────────────────────────────
function renderGame() {
  if(!currentPlayer) return;
  const saved = guesses[currentPlayer.id] || {};
  const pts = playerTotalPts(currentPlayer.id);
  const groups = ["Todos",...Array.from(new Set(matches.map(m=>m.group))).sort()];
  const visible = gameFilter==="Todos" ? matches : matches.filter(m=>m.group===gameFilter);
  const groupBtns = groups.map(g=>`<button class="group-btn${gameFilter===g?" active":""}" onclick="setGameFilter('${g}')">${g==="Todos"?"Todos":"G"+g}</button>`).join("");

  let cards = "";
  visible.forEach(m => {
    const g = saved[m.id];
    const hval = g!==undefined ? g.home : "";
    const aval = g!==undefined ? g.away : "";
    const locked = isLocked(m);
    let resultHTML = "";
    if(m.realHome!==null && g!==undefined) {
      const s = calcPts(g,m);
      const colors = {10:"#00e676",7:"#69f0ae",5:"#b2ff59",0:"#ff5252"};
      const labels = {10:"🎯 Placar exato! +10pts",7:"✅ Empate certo! +7pts",5:"✅ Vencedor certo +5pts",0:"❌ Errou"};
      resultHTML = `<div style="margin-top:7px;font-size:11px;color:#555;text-align:center">Placar real: <b style="color:#fff">${m.realHome} × ${m.realAway}</b> <span style="color:${colors[s]};margin-left:6px">${labels[s]}</span></div>`;
    }
    const bl = m.realHome!==null&&g!==undefined
      ? `border-left:3px solid ${{10:"#00e676",7:"#69f0ae",5:"#b2ff59",0:"#ff5252"}[calcPts(g,m)]}`
      : locked ? "border-left:3px solid #2a2a2a" : "";
    cards += `<div class="match-card" style="${bl}${locked?";opacity:.75":""}">
      <div style="display:flex;justify-content:space-between;font-size:11px;color:#444;margin-bottom:8px">
        <span style="color:#FFD700;font-weight:700">Grupo ${m.group} • R${m.rodada}</span>
        <span>${m.date} ${m.time}${locked?` <span class="locked-badge">🔒 ENCERRADO</span>`:""}</span>
      </div>
      <div style="display:flex;align-items:center;gap:4px">
        <div style="flex:1;display:flex;align-items:center;gap:5px"><span style="font-size:20px">${m.homeFlag}</span><span style="font-size:11px;font-weight:600;color:#ccc">${m.home}</span></div>
        <div style="display:flex;align-items:center;gap:5px">
          <input class="score-inp" data-mid="${m.id}" data-side="home" value="${hval}" placeholder="0" oninput="this.value=this.value.replace(/\\D/g,'').slice(0,2)" inputmode="numeric"${locked?" disabled":""}/>
          <span style="color:#333;font-weight:700">×</span>
          <input class="score-inp" data-mid="${m.id}" data-side="away" value="${aval}" placeholder="0" oninput="this.value=this.value.replace(/\\D/g,'').slice(0,2)" inputmode="numeric"${locked?" disabled":""}/>
        </div>
        <div style="flex:1;display:flex;align-items:center;gap:5px;justify-content:flex-end"><span style="font-size:11px;font-weight:600;color:#ccc">${m.away}</span><span style="font-size:20px">${m.awayFlag}</span></div>
      </div>
      ${resultHTML}
    </div>`;
  });

  const gameEl = document.getElementById("screen-game");
  gameEl.innerHTML = `
    <div class="screen">
      <div class="header">
        <button class="back-btn" onclick="goTo('home')">‹ Voltar</button>
        <div><div style="font-weight:800;font-size:18px">${currentPlayer.name}</div><div style="color:#FFD700;font-size:12px;font-weight:600">${pts} pts acumulados</div></div>
      </div>
      <div class="groups-scroll">${groupBtns}</div>
      ${cards}
      <button class="btn-gold" onclick="saveGuesses()">💾 Salvar Palpites</button>
      <div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:16px;font-size:11px;color:#444">
        <span>🎯 Placar exato = <b style="color:#aaa">10pts</b></span>
        <span>✅ Empate certo = <b style="color:#aaa">7pts</b></span>
        <span>✅ Vencedor certo = <b style="color:#aaa">5pts</b></span>
      </div>
    </div>`;
}

window.setGameFilter = function(g) { gameFilter=g; renderGame(); };

window.saveGuesses = async function() {
  if(!currentPlayer) return;
  const inputs = document.querySelectorAll("#screen-game .score-inp");
  const toSave = {};
  inputs.forEach(inp => {
    const mid = +inp.dataset.mid, side = inp.dataset.side;
    if(!toSave[mid]) toSave[mid] = {};
    toSave[mid][side] = inp.value;
  });
  const filled = Object.entries(toSave).filter(([mid,g])=>
    g.home!==""&&g.away!==""&&!isLocked(matches.find(m=>m.id===+mid))
  );
  if(!filled.length) { showToast("Preencha pelo menos um palpite disponível!","err"); return; }
  const updates = {};
  filled.forEach(([id,g]) => { updates[`guesses/${currentPlayer.id}/${id}`] = {home:+g.home, away:+g.away}; });
  await db.ref().update(updates);
  showToast("Palpites salvos! ✅");
  goTo("home");
};

// ── RANKING ───────────────────────────────────────────────────────────────
function renderRanking() {
  const played = matches.filter(m=>m.realHome!==null).length;
  const medals = ["🥇","🥈","🥉"];
  const ranking = players.map(p=>({...p,pts:playerTotalPts(p.id)})).sort((a,b)=>b.pts-a.pts);
  let rows = ranking.length===0
    ? `<div style="text-align:center;color:#333;padding:60px">Nenhum participante ainda</div>`
    : ranking.map((p,i)=>`
      <div class="match-card" style="display:flex;align-items:center;gap:12px;${i===0?"border:1px solid #FFD700;background:#181400":""}">
        <span style="font-size:26px;width:32px;text-align:center">${medals[i]||`${i+1}º`}</span>
        <span class="avatar">${p.name[0].toUpperCase()}</span>
        <span style="flex:1;font-weight:700;font-size:15px">${p.name}</span>
        <div style="text-align:right">
          <div style="font-size:24px;font-weight:900;color:#FFD700;line-height:1">${p.pts}</div>
          <div style="font-size:10px;color:#444">pontos</div>
        </div>
      </div>`).join("");

  document.getElementById("screen-ranking").innerHTML = `
    <div class="screen">
      <div class="header">
        <button class="back-btn" onclick="goTo('home')">‹ Voltar</button>
        <div style="font-weight:800;font-size:18px">🏅 Ranking</div>
      </div>
      <p style="color:#444;text-align:center;font-size:12px;margin-bottom:16px"><span class="live-dot"></span>${played}/72 jogos apurados • atualização em tempo real</p>
      ${rows}
    </div>`;
}

// ── ADMIN ─────────────────────────────────────────────────────────────────
function renderAdmin() {
  if(!adminUnlocked) {
    document.getElementById("screen-admin").innerHTML = `
      <div class="screen">
        <div class="header">
          <button class="back-btn" onclick="goTo('home')">‹ Voltar</button>
          <div style="font-weight:800;font-size:18px">⚙️ Admin</div>
        </div>
        <div class="card">
          <div class="label">SENHA DO ADMIN</div>
          <p style="color:#555;font-size:12px;margin-bottom:12px">Senha padrão: <b style="color:#aaa">copa2026</b></p>
          <div style="display:flex;gap:8px">
            <input class="inp" id="admin-pass" type="password" placeholder="Senha..." onkeydown="if(event.key==='Enter')tryAdmin()"/>
            <button class="btn btn-green" onclick="tryAdmin()">›</button>
          </div>
        </div>
      </div>`;
    return;
  }
  const groups = ["Todos",...Array.from(new Set(matches.map(m=>m.group))).sort()];
  const visible = adminFilter==="Todos" ? matches : matches.filter(m=>m.group===adminFilter);
  const groupBtns = groups.map(g=>`<button class="group-btn${adminFilter===g?" active":""}" onclick="setAdminFilter('${g}')">${g==="Todos"?"Todos":"G"+g}</button>`).join("");
  let cards = "";
  visible.forEach(m => {
    const hval = m.realHome!==null ? m.realHome : "";
    const aval = m.realAway!==null ? m.realAway : "";
    cards += `<div class="match-card">
      <div style="display:flex;justify-content:space-between;font-size:11px;color:#444;margin-bottom:8px">
        <span style="color:#FFD700;font-weight:700">Grupo ${m.group} • R${m.rodada}</span><span>${m.date} ${m.time}</span>
      </div>
      <div style="display:flex;align-items:center;gap:4px">
        <div style="flex:1;display:flex;align-items:center;gap:5px"><span style="font-size:20px">${m.homeFlag}</span><span style="font-size:11px;font-weight:600;color:#ccc">${m.home}</span></div>
        <div style="display:flex;align-items:center;gap:5px">
          <input class="score-inp" data-mid="${m.id}" data-side="home" value="${hval}" placeholder="?" oninput="this.value=this.value.replace(/\\D/g,'').slice(0,2)" inputmode="numeric"/>
          <span style="color:#333;font-weight:700">×</span>
          <input class="score-inp" data-mid="${m.id}" data-side="away" value="${aval}" placeholder="?" oninput="this.value=this.value.replace(/\\D/g,'').slice(0,2)" inputmode="numeric"/>
        </div>
        <div style="flex:1;display:flex;align-items:center;gap:5px;justify-content:flex-end"><span style="font-size:11px;font-weight:600;color:#ccc">${m.away}</span><span style="font-size:20px">${m.awayFlag}</span></div>
      </div>
    </div>`;
  });
  const adminEl = document.getElementById("screen-admin");
  adminEl.innerHTML = `
    <div class="screen">
      <div class="header">
        <button class="back-btn" onclick="goTo('home')">‹ Voltar</button>
        <div style="font-weight:800;font-size:18px">⚙️ Inserir Resultados</div>
      </div>
      <div class="groups-scroll">${groupBtns}</div>
      ${cards}
      <button class="btn-gold" onclick="saveResults()">💾 Salvar Resultados</button>
    </div>`;
}

window.tryAdmin = function() {
  const v = document.getElementById("admin-pass").value;
  if(v==="copa2026") { adminUnlocked=true; renderAdmin(); }
  else showToast("Senha incorreta!","err");
};

window.setAdminFilter = function(g) { adminFilter=g; renderAdmin(); };

window.saveResults = async function() {
  const inputs = document.querySelectorAll("#screen-admin .score-inp");
  const updates = {};
  inputs.forEach(inp => {
    const mid = +inp.dataset.mid, side = inp.dataset.side;
    if(inp.value!=="") updates[`results/${mid}/${side}`] = +inp.value;
  });
  await db.ref().update(updates);
  showToast("Resultados salvos! ✅");
  goTo("home");
};

// ── Init ──────────────────────────────────────────────────────────────────
initFirebase();
renderHome();
</script>
</body>
</html>
